<!DOCTYPE html>
<html lang="en">

<head> 
  <meta charset="UTF-8">
  <title>Mount Susitna Topography Quilt</title> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        @font-face {
            font-family: 'westfalia';
            src: url(index/westfaliav2-regular.woff);
        }
        @font-face {
            font-family: 'patrickhand';
            src: url(index/PatrickHand-Regular.ttf);
        }
        body{
            position: absolute;
            width: 100vw;
            height: 100vh;
            top: 0vw;
            left: 0vh;
            margin: 0;
            padding: 0;
            background-color: #FCF5EB;
            background-image: url("index/dotcrossdark.png");
            background-size: auto;
            background-repeat: repeat;
        } 

        /*heading*/
        .heading{
            position: absolute;
            background-color: #FCF5EB;
            width: 100vw;
            height: 5vh;
            top: 0px;
            left: 0px;
            border-bottom: 2px solid #6f7b97;
            color: #525d76 !important;
        }
        .name{
            position: absolute;
            width: 50vw;
            height: 5vh;
            left: 0vw;
            top: 0vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "westfalia";
            font-size: 3.5vh;
        }
        .links{
            position: absolute;
            width: 50vw;
            height: 5vh;
            right: 0vw;
            top: 0vh;
            display: flex;
            justify-content: space-evenly;
            align-items: center;
            font-family: "patrickhand";
            font-size: 2.5vh;
        }
        .heading a{
            color: #525d76 !important;
            text-decoration: none;
        }
        .heading a:hover{
            color: #899dcd !important;
        }

        /*page content*/
        .carousel{
            position: absolute;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;

        }
        .slideshow-container {
            position: relative;
            width: 60vw;
            height: auto;
        }
        .mySlides {
            display: none;
            overflow: scroll;
            scrollbar-color: #525d76 rgba(252, 245, 235, 0.7) !important;
            scrollbar-width: thin !important;
        }
        .mySlides input[type=checkbox] {
            display: none
        }
        .mySlides img {
            border: 0;
            width: 100%;
            height: 100%;
            transition: transform 0.25s ease;
            cursor: zoom-in;
            object-fit: cover;
            
        }
        .mySlides input[type=checkbox]:checked~img {
            transform: scale(2) translate(25%, 25%);
            cursor: zoom-out;
        }

        .prev, .next {
            cursor: pointer;
            position: absolute;
            top: 50%;
            width: auto;
            margin-top: -22px;
            padding: 16px;
            color: #FCF5EB;
            font-weight: bold;
            font-size: 18px;
            transition: 0.6s ease;
            border-radius: 0 3px 3px 0;
            user-select: none;
        }
        .next {
            right: 0;
            border-radius: 3px 0 0 3px;
        }
        .prev {
            left: 0;
        }
        .prev:hover, .next:hover {
            background-color: rgba(82, 93, 118, 0.7);
        }

        .dots{
            position: absolute;
            width: 100vw;
            bottom: 5vh;
        }
        .dot {
            cursor: pointer;
            height: 15px;
            width: 15px;
            margin: 0 2px;
            background-color: #a7b5d5;
            border-radius: 50%;
            display: inline-block;
            transition: background-color 0.6s ease;
        }
        .active, .dot:hover {
            background-color: #525d76;
        }

        .fade {
            animation-name: fade;
            animation-duration: 1.5s;
        }

        @keyframes fade {
            from {opacity: .4}
            to {opacity: 1}
        }
    </style>
</head> 

<body> 
    <div class="heading">
        <div class="name">
            Ilana Schnaufer
        </div>
        <div class="links">
            <a href="index.html">Projects</a>
            <a href="about.html">About</a>
        </div>
    </div>

    <div class="carousel">
        <div class="slideshow-container" id="Carousel">
            <div class="mySlides fade">
                <label>
                    <input type="checkbox">
                    <img src="susitnaquilt/quilt1.jpg" >
                </label>
            </div>

            <div class="mySlides fade">
                <label>
                    <input type="checkbox">
                    <img src="susitnaquilt/quilt2.jpg">
                </label>
            </div>

            <div class="mySlides fade">
                <label>
                    <input type="checkbox">
                    <img src="susitnaquilt/quilt3.jpg">
                </label>
            </div>

            <div class="mySlides fade">
                <label>
                    <input type="checkbox">
                    <img src="susitnaquilt/quilt4.jpg">
                </label>
            </div>

            <div class="mySlides fade">
                <label>
                    <input type="checkbox">
                    <img src="susitnaquilt/quilt5.jpg">
                </label>
            </div>

            <a class="prev" onclick="plusSlides(-1)">&#10094;</a>
            <a class="next" onclick="plusSlides(1)">&#10095;</a>
        </div>
        <br>

        <div class="dots" style="text-align:center">
            <span class="dot" onclick="currentSlide(1)"></span>
            <span class="dot" onclick="currentSlide(2)"></span>
            <span class="dot" onclick="currentSlide(3)"></span>
            <span class="dot" onclick="currentSlide(4)"></span>
            <span class="dot" onclick="currentSlide(5)"></span>
        </div>
    </div>  
    <script>
        let slideIndex = 1;
        showSlides(slideIndex);

        // Next/previous controls
        function plusSlides(n) {
        showSlides(slideIndex += n);
        }

        // Thumbnail image controls
        function currentSlide(n) {
        showSlides(slideIndex = n);
        }

        function showSlides(n) {
        let i;
        let slides = document.getElementsByClassName("mySlides");
        let dots = document.getElementsByClassName("dot");
        if (n > slides.length) {slideIndex = 1}
        if (n < 1) {slideIndex = slides.length}
        for (i = 0; i < slides.length; i++) {
            slides[i].style.display = "none";
        }
        for (i = 0; i < dots.length; i++) {
            dots[i].className = dots[i].className.replace(" active", "");
        }
        slides[slideIndex-1].style.display = "block";
        dots[slideIndex-1].className += " active";
        } 

    </script>
</body> 

</html>
